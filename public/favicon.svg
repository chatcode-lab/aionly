<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The header logo's eyes (app/components/site-logo.tsx), on nothing, in the dark theme's colors on a dark tab strip. -->
  <style>
    .ink { stroke: #1b1a18; }
    .ink-fill { fill: #1b1a18; }
    .tint { stroke: #c2410c; }
    .tint-fill { fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f2f0ec; }
      .ink-fill { fill: #f2f0ec; }
      .tint { stroke: #ff9a5c; }
      .tint-fill { fill: #ff9a5c; }
    }
  </style>
  <g transform="translate(0.25 12)" fill="none" stroke-width="4">
    <circle class="ink" cx="12" cy="12" r="8.5"/>
    <circle class="ink-fill" cx="12" cy="12" r="3.6"/>
    <rect class="tint" x="27" y="3.5" width="17" height="17" rx="3.5"/>
    <rect class="tint-fill" x="32" y="8.5" width="7" height="7" rx="1"/>
  </g>
</svg>
